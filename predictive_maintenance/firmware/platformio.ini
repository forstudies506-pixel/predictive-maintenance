[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; ESP_TF is a PlatformIO/Arduino-compatible TFLM port built from Espressif's
; TFLM sources. Version 2.1.1 is the first release in this package line that
; fixes ESP32-S3 ESP-NN duplicate-kernel build problems.
lib_deps =
    nickjgniklu/ESP_TF@^2.1.1

; These flags compile the ESP-NN kernels for the ESP32-S3. They must reach the
; TFLM library translation units, not only this sketch.
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED
    -DARCH_ESP32_S3
    ; Change these two pins to match the actual board wiring.
    -DPM_MPU6050_SDA_PIN=8
    -DPM_MPU6050_SCL_PIN=9
